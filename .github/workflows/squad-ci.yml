name: Squad CI
# dotnet project — configure build/test commands below

on:
  pull_request:
    branches: [dev, preview, main, insider]
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, insider]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x

      - name: Build
        run: dotnet build ElBruno.Realtime.slnx --configuration Release

      - name: Test
        run: dotnet test ElBruno.Realtime.slnx --configuration Release --no-build
